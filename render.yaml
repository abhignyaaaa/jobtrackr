# Render Blueprint: provisions the web service and a managed PostgreSQL
# database together. Deploy with Render Dashboard -> New -> Blueprint.
services:
  - type: web
    name: jobtrackr
    runtime: python
    plan: free
    region: singapore          # closest Render region to India
    buildCommand: pip install -r requirements.txt
    # Create tables once, then start 2 uvicorn workers behind Render's proxy.
    startCommand: python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: APP_ENV
        value: production
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: SECRET_KEY
        generateValue: true     # random secret generated by Render, never in git
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrackr-db
          property: connectionString   # internal URL: traffic stays on Render's private network
      - key: STORAGE_BACKEND
        value: disabled         # set to "s3" + S3_* vars to enable resume uploads

databases:
  - name: jobtrackr-db
    plan: free
    region: singapore
    databaseName: jobtrackr
    user: jobtrackr
    ipAllowList: []             # no public access; only services in this Render workspace can connect
